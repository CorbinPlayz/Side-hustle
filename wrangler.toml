name = "side-hustle"
main = "worker/src/index.mjs"
compatibility_date = "2025-03-01"
workers_dev = true
preview_urls = false

# The website files. The Worker runs first so it can check the login before sending anything.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
# Serve files exactly as named. The default rewrites login.html to /login, which then bounced back to login.html forever.
html_handling = "none"
not_found_handling = "none"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[durable_objects.bindings]]
name = "MATCH"
class_name = "Match"

[[durable_objects.bindings]]
name = "WORLD"
class_name = "World"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub", "Match"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["World"]

[vars]
# The admin is the account with this user ID. Leave 0 until you have registered; your ID is shown on the "waiting for approval" screen.
ADMIN_ID = "1"
# Second lock for the admin panel: add a secret named ADMIN_KEY in the Cloudflare dashboard (Settings > Variables and Secrets, type Secret). When it exists, the admin page asks for it.
# Optional invite code: if you set one, people need it to create an account. Leave empty for open sign-up (you still approve each person).
SIGNUP_CODE = ""

[observability]
enabled = false
